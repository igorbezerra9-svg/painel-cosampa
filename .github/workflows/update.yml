name: Atualizar painel

on:
  schedule:
    # off the top of the hour on purpose — GitHub's own docs warn that
    # "0 * * * *" runs are frequently delayed because every scheduled
    # workflow on the platform tries to fire at :00
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas tzdata

      - run: python compute_painel.py

      - name: Publicar se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Atualização automática"
          git pull --rebase --autostash
          git push
