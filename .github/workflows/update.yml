name: Atualizar painel

on:
  schedule:
    # this is now just a safety net — the Google Sheet triggers a workflow_dispatch
    # instantly via the GitHub API right after each merge, since GitHub's own
    # "schedule" trigger is documented to get delayed (sometimes by hours) under
    # platform load, especially at very short intervals like */5
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Sem isso, o cron e o dispatch da planilha rodavam ao mesmo tempo: os dois
# recalculavam, os dois davam push, o segundo perdia a corrida, entrava no
# retry (fetch/reset/recalcula) e dava push de novo. Resultado visível no
# histórico: commits sempre aos pares, ~30s de diferença, com dados idênticos
# (só o carimbo de hora mudava). Cada par disparava 2 publicações no Pages, e
# a segunda cancelava a primeira no meio. cancel-in-progress: false porque
# matar um run no meio de um push é pior que deixar ele terminar.
concurrency:
  group: atualizar-painel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas tzdata

      - name: Recalcular e publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # index.html e dados.json são 100% gerados a partir do template.html +
          # da planilha, então sempre que o push falhar (ex.: alguém commitou algo
          # ao mesmo tempo), basta re-sincronizar com o main mais recente e
          # recalcular de novo em cima dele — nunca há conflito de verdade.
          #
          # No dia a dia só o dados.json muda; o index.html só aparece aqui
          # quando o template muda (aí sim precisa de uma publicação no Pages).
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python compute_painel.py
            git add index.html dados.json
            if git diff --staged --quiet; then
              echo "Nada para publicar."
              exit 0
            fi
            git commit -m "Atualização automática"
            if git push origin HEAD:main; then
              echo "Publicado."
              exit 0
            fi
            echo "Push falhou (corrida com outro commit), tentando de novo..."
            sleep 5
          done
          echo "Falhou depois de várias tentativas." >&2
          exit 1
