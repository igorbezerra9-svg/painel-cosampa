name: Atualizar painel

on:
  schedule:
    # 5 minutes is the shortest interval GitHub Actions allows for
    # scheduled workflows — runs can still be a few minutes late under load
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas tzdata

      - name: Recalcular e publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # index.html é 100% gerado a partir do template.html + da planilha, então
          # sempre que o push falhar (ex.: alguém commitou algo ao mesmo tempo),
          # basta re-sincronizar com o main mais recente e recalcular de novo em
          # cima dele — nunca há conflito de verdade para resolver.
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python compute_painel.py
            git add index.html
            if git diff --staged --quiet; then
              echo "Nada para publicar."
              exit 0
            fi
            git commit -m "Atualização automática"
            if git push origin HEAD:main; then
              echo "Publicado."
              exit 0
            fi
            echo "Push falhou (corrida com outro commit), tentando de novo..."
            sleep 5
          done
          echo "Falhou depois de várias tentativas." >&2
          exit 1
